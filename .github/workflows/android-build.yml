name: Astra Emulator Android build

on:
  workflow_dispatch:
  push:
    branches:
      - mali-g57-optimization
    paths:
      - ".github/workflows/android-build.yml"
      - "src/android/**"
      - "src/**"
      - ".ci/android/**"
      - "CMakeLists.txt"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    name: Build Astra Emulator APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache CPM dependency downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ccache

      - name: Cache ccache compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Install Android SDK components
        run: |
          SDK_MANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null
          "$SDK_MANAGER" \
            "platforms;android-36" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Build Astra Emulator Release APK
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          chmod +x .ci/android/build.sh
          CCACHE=true .ci/android/build.sh -t astra -b Release
          ccache --show-stats

      - name: Upload Astra APK and AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-emulator-${{ github.ref_name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
