    .lemon-highlight { fill: #FFEB8A; }   /* wedge inner highlight */
    .lemon-pith      { stroke: #FFF6D6; stroke-width: 6; stroke-linecap: round; }

    .pad-body        { fill: #F0432E; }   /* controller red */
    .pad-shade       { fill: #D8331F; }   /* subtle darker red edge */
    .button-face     { fill: #1E1E1E; }   /* D-pad / face buttons */
    .stick-outer     { fill: #241F1E; }   /* joystick outer ring */
    .stick-inner     { fill: #3A3230; }   /* joystick inner cap */
    .cap-button      { fill: #1E1E1E; }   /* small square capture button */

    .leaf-light      { fill: #4CAF50; }
    .leaf-dark       { fill: #2E7D32; }
    .leaf-vein       { stroke: #1B5E20; stroke-width: 4; stroke-linecap: round; }

    .outline         { fill: none; stroke: #1A1A1A; stroke-width: 10; stroke-linejoin: round; }
    .outline-thin    { fill: none; stroke: #1A1A1A; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .seam            { fill: none; stroke: #1A1A1A; stroke-width: 10; stroke-linecap: round; }
  </style>
